<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Pending List</title>  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>  <style>    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }    body {      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;      background: #e8f5e9;      display: flex; justify-content: center;      min-height: 100vh; padding: 40px 16px;    }    .container {      width: 100%; max-width: 520px;      background: #fff;      border-radius: 12px;      box-shadow: 0 2px 12px rgba(0,0,0,.08);      padding: 32px;      align-self: flex-start;    }    h1 {      font-size: 24px; font-weight: 700;      color: #1a1a2e; margin-bottom: 24px;      display: flex; align-items: center; gap: 8px;    }    h1::before {      content: "✓";      display: inline-flex; align-items: center; justify-content: center;      width: 32px; height: 32px;      background: #eab308; color: #fff;      border-radius: 8px; font-size: 16px;    }    /* ── Input ── */    .input-row {      display: flex; gap: 10px; margin-bottom: 24px;    }    .input-row input {      flex: 1; padding: 10px 14px;      border: 2px solid #e5e7eb; border-radius: 8px;      font-size: 15px; outline: none;      transition: border-color .2s;    }    .input-row input:focus { border-color: #eab308; }    .input-row button {      padding: 10px 20px;      background: #eab308; color: #fff;      border: none; border-radius: 8px;      font-size: 15px; font-weight: 600;      cursor: pointer; transition: background .2s;      white-space: nowrap;    }    .input-row button:hover { background: #ca8a04; }    /* ── Stats ── */    .stats {      display: flex; justify-content: space-between; align-items: center;      margin-bottom: 16px; font-size: 14px; color: #6b7280;    }    .stats span { font-weight: 500; }    /* ── Filters ── */    .filters { display: flex; gap: 6px; }    .filters button {      padding: 4px 14px; border: 1px solid #e5e7eb;      border-radius: 16px; background: #fff;      font-size: 13px; cursor: pointer; color: #6b7280;      transition: all .2s;    }    .filters button.active {      background: #eab308; color: #fff; border-color: #eab308;    }    .filters button:not(.active):hover { border-color: #eab308; color: #eab308; }    /* ── List ── */    .todo-list { list-style: none; }    .todo-item {      display: flex; align-items: center; gap: 12px;      padding: 12px 0; border-bottom: 1px solid #f3f4f6;      transition: opacity .2s;    }    .todo-item:last-child { border-bottom: none; }    .todo-item .checkbox {      width: 20px; height: 20px; border-radius: 50%;      border: 2px solid #d1d5db;      display: flex; align-items: center; justify-content: center;      cursor: pointer; flex-shrink: 0;      transition: all .2s;    }    .todo-item .checkbox:hover { border-color: #eab308; }    .todo-item .checkbox.done {      background: #eab308; border-color: #eab308;    }    .todo-item .checkbox.done::after {      content: "✓"; color: #fff; font-size: 12px; font-weight: 700;    }    .todo-item .text {      flex: 1; font-size: 15px; color: #1f2937;      word-break: break-word; transition: color .2s;    }    .todo-item .text.done {      text-decoration: line-through; color: #9ca3af;    }    .todo-item .delete {      width: 28px; height: 28px; border-radius: 6px;      border: none; background: transparent;      color: #9ca3af; font-size: 18px; cursor: pointer;      display: flex; align-items: center; justify-content: center;      transition: all .2s; flex-shrink: 0;    }    .todo-item .delete:hover { background: #fef2f2; color: #ef4444; }    /* ── Empty ── */    .empty {      text-align: center; padding: 40px 0;      color: #9ca3af; font-size: 15px;    }    /* ── Clear completed ── */    .footer-actions {      margin-top: 16px; padding-top: 16px;      border-top: 1px solid #f3f4f6;      display: flex; justify-content: flex-end;    }    .footer-actions button {      padding: 6px 16px; border: 1px solid #e5e7eb;      border-radius: 6px; background: #fff;      font-size: 13px; cursor: pointer; color: #6b7280;      transition: all .2s;    }    .footer-actions button:hover { border-color: #ef4444; color: #ef4444; }  </style></head><body><div id="app">  <div class="container">    <h1>Pending List</h1>    <div class="input-row">      <input v-model="newTodo" type="text" placeholder="What needs to be done?" @keydown.enter="addTodo" autofocus />      <button @click="addTodo">Add</button>    </div>    <div class="stats">      <span>{{ activeCount }} item(s) left</span>      <div class="filters">        <button :class="{ active: filter === 'all' }" @click="filter = 'all'">All</button>        <button :class="{ active: filter === 'active' }" @click="filter = 'active'">Active</button>        <button :class="{ active: filter === 'completed' }" @click="filter = 'completed'">Completed</button>      </div>    </div>    <ul class="todo-list">      <li v-if="filteredTodos.length === 0" class="empty">{{ emptyMessage }}</li>      <li v-for="todo in filteredTodos" :key="todo.id" class="todo-item">        <div class="checkbox" :class="{ done: todo.done }" @click="toggleTodo(todo)"></div>        <span class="text" :class="{ done: todo.done }">{{ todo.text }}</span>        <button class="delete" @click="deleteTodo(todo)" title="Delete">✕</button>      </li>    </ul>    <div v-show="hasCompleted" class="footer-actions">      <button @click="clearCompleted">Clear completed</button>    </div>  </div></div><script>const { createApp, ref, computed, watch } = Vue;createApp({  setup() {    const STORAGE_KEY = 'todos';    const todos = ref(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));    const filter = ref('all');    const newTodo = ref('');    const filteredTodos = computed(() => {      if (filter.value === 'active') return todos.value.filter(t => !t.done);      if (filter.value === 'completed') return todos.value.filter(t => t.done);      return todos.value;    });    const activeCount = computed(() => todos.value.filter(t => !t.done).length);    const hasCompleted = computed(() => todos.value.some(t => t.done));    const emptyMessage = computed(() => {      if (filter.value === 'all') return 'No todos yet. Add one above ✏️';      if (filter.value === 'active') return 'No active items 🎉';      return 'No completed items';    });    watch(todos, val => {      localStorage.setItem(STORAGE_KEY, JSON.stringify(val));    }, { deep: true });    function addTodo() {      const text = newTodo.value.trim();      if (!text) return;      todos.value.push({ id: Date.now() + Math.random(), text, done: false });      newTodo.value = '';    }    function toggleTodo(todo) { todo.done = !todo.done; }    function deleteTodo(todo) {      const idx = todos.value.indexOf(todo);      if (idx !== -1) todos.value.splice(idx, 1);    }    function clearCompleted() { todos.value = todos.value.filter(t => !t.done); }    return { newTodo, filter, filteredTodos, activeCount, hasCompleted, emptyMessage, addTodo, toggleTodo, deleteTodo, clearCompleted };  }}).mount('#app');</script></body></html>
